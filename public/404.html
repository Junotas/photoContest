<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var segmentCount = 1; // repo pages: /photoContest/...
        var l = window.location;
        var path = l.pathname.split("/").slice(0, 1 + segmentCount).join("/") + "/";
        var rest = l.pathname.split("/").slice(1 + segmentCount).join("/");
        l.replace(
          l.protocol +
            "//" +
            l.host +
            path +
            "?p=" +
            encodeURIComponent(rest) +
            (l.search ? "&q=" + encodeURIComponent(l.search.slice(1)) : "") +
            (l.hash || "")
        );
      })();
    </script>
  </head>
  <body></body>
</html>
